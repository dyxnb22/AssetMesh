[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers",
    "crates/storage-sqlite",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
assetmesh-core = { path = "crates/core" }
assetmesh-providers = { path = "crates/providers" }
assetmesh-storage-sqlite = { path = "crates/storage-sqlite" }

chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
fs2 = "0.4"
plist = "1"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
