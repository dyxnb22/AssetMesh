name: Cross-Platform CI & Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: Linux CI & Headless E2E (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Frontend unit & release gate tests
        run: |
          npm test
          npm run test:e2e

      - name: Frontend build
        run: npm run build

      - name: Cargo check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo test workspace under Xvfb
        run: xvfb-run cargo test --workspace -- --nocapture

      - name: 50k Scale Performance Benchmark Gate
        run: npm run test:scale

  macos-ci:
    name: macOS CI & Release Gate (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Frontend unit & release gate tests
        run: |
          npm test
          npm run test:e2e

      - name: Frontend build
        run: npm run build

      - name: Cargo test workspace
        run: cargo test --workspace

      - name: 50k Scale Performance Benchmark Gate
        run: npm run test:scale
